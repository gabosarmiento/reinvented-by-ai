name: Render and publish draft book

on:
  pull_request:
    branches: [main]
  push:
    branches: ["draft/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML book
        run: quarto render --to html

      - name: Upload HTML preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-company-html-preview
          path: _build/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/draft/chapter-evidence-review'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/draft/chapter-evidence-review'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/draft/chapter-evidence-review'
    needs: render-html
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy draft to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
