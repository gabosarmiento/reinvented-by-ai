name: Render private book preview

on:
  pull_request:
    branches: [main]
  push:
    branches: ["draft/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML book
        run: quarto render --to html

      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-company-html-preview
          path: _build/
          if-no-files-found: error
          retention-days: 14
